name: Web build and release validation
on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      windows_release:
        description: Optional release tag to validate on Windows
        type: string
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: murang-run-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'release' && !inputs.windows_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and verify release checksums
        shell: bash
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          editor=Godot_v4.7.2-stable_linux.x86_64.zip
          templates=Godot_v4.7.2-stable_export_templates.tpz
          curl -fL --retry 3 "$base/$editor" -o "$RUNNER_TEMP/$editor"
          curl -fL --retry 3 "$base/$templates" -o "$RUNNER_TEMP/$templates"
          (
            cd "$RUNNER_TEMP"
            echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $editor" | sha256sum -c
            echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $templates" | sha256sum -c
            unzip -qo "$editor" -d godot-bin
            mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
            install_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
            unzip -jo "$templates" 'templates/web_nothreads_*.zip' -d "$install_dir"
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              unzip -jo "$templates" templates/windows_release_x86_64.exe -d "$install_dir"
            fi
          )
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Validate the game and export Web
        shell: bash
        run: |
          godot=Godot_v4.7.2-stable_linux.x86_64
          "$godot" --headless --editor --import --path .
          XDG_DATA_HOME="$RUNNER_TEMP/murang-smoke" "$godot" --headless --path . --script tests/smoke.gd
          mkdir -p build/web
          touch build/.gdignore
          "$godot" --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.wasm
      - name: Export Windows and package both platforms
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          mkdir -p build/windows "$RUNNER_TEMP/godot-notices"
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/windows/MurangRun.exe
          base=https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable
          for doc in LICENSE COPYRIGHT; do
            curl -fsSL --retry 3 "$base/$doc.txt" -o "$RUNNER_TEMP/godot-notices/Godot-$doc.txt"
          done
          python3 tools/package_release.py build/release "$RUNNER_TEMP/godot-notices"
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: murang-release
          path: build/release
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_type == 'branch'
        with:
          path: build/web

  deploy:
    if: github.ref_type == 'branch' && (github.event.repository.has_pages || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: murang-release
          path: release
      - name: Publish both downloads on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME%.*}"
          test -s "release/MurangRun-$version-Windows-x64.zip"
          gh release create "$GITHUB_REF_NAME" "release/MurangRun-$version-Windows-x64.zip" "release/MurangRun-$version-Web.zip" release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "무랑 런 $version" --notes-file .github/release-notes.md

  windows-release:
    needs: publish
    if: always() && (needs.publish.result == 'success' || github.event_name == 'release' || inputs.windows_release != '')
    runs-on: windows-latest
    steps:
      - name: Download published package and launch its embedded game
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.windows_release || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'MurangRun.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'MurangRun'
          $tag = [uri]::EscapeDataString($env:RELEASE_TAG)
          $version = $env:RELEASE_TAG -replace '\.[0-9]+$', ''
          Invoke-WebRequest "https://github.com/$env:REPO/releases/download/$tag/MurangRun-$version-Windows-x64.zip" -OutFile $archive
          Expand-Archive $archive $folder
          Push-Location $folder
          $process = Start-Process -FilePath '.\MurangRun.exe' -ArgumentList @('--headless', '--quit-after', '60', '--log-file', 'murang-smoke.log') -PassThru -Wait
          $log = Get-Content -Raw 'murang-smoke.log'
          Write-Output $log
          if ($process.ExitCode -ne 0 -or $log -notmatch 'Godot Engine v4\.7\.2' -or $log -match 'SCRIPT ERROR|Failed to load|ERROR:') {
            throw "Windows executable smoke test failed (exit $($process.ExitCode))"
          }
